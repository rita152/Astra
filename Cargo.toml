[package]
name = "gpui-chat-clone"
version = "0.1.0"
edition = "2024"

[features]
default = []
screenshot = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
anyhow = "1"
async-channel = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2", features = ["font-kit"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2", features = ["font-kit", "test-support"] }

# block 0.1.6 declares an opaque Objective-C runtime symbol as an uninhabited
# Rust enum. Keep the ABI address identical while giving the extern static an
# inhabited byte type, avoiding Rust's future-incompatibility diagnostic.
[patch.crates-io]
block = { path = "vendor/block" }

# GPUI's layout, text, and Metal submission paths are too expensive at Cargo's
# default opt-level=0 on a fullscreen drawable. Keep local code debuggable while
# compiling the framework hot paths at their production optimization level.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
