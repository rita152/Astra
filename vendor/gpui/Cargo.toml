[package]
name = "gpui"
version = "0.2.2"
edition = "2024"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
publish = false
license = "Apache-2.0"
homepage = "https://gpui.rs"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_analyzer)'] }



[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
    "proptest",
]
bench = ["test-support", "profiler", "dep:criterion"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
wayland = []
x11 = [
    "scap?/x11",
]
screen-capture = [
    "scap",
]
windows-manifest = ["dep:embed-resource"]
profiler = ["dep:hdrhistogram"]

[lib]
path = "src/gpui.rs"
doctest = false

[dependencies]
unicode-linebreak = "0.1.5"
accesskit = { version = "0.24.0", features = ["enumn"] }
anyhow = { version = "1.0.86" }
async-task = { version = "4.7" }
backtrace = { version = "0.3", optional = true }
bitflags = { version = "2.6.0" }

collections = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
criterion = { version = "0.5", features = ["html_reports"], optional = true }
ctor = { version = "1.0.12" }
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from", "from_str", "mul", "mul_assign", "not"] }
etagere = { version = "0.2" }
futures = { version = "0.3.32" }
futures-concurrency = { version = "7.7.1" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
gpui_shared_string = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
http_client = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
inventory = { version = "0.3.19" }
itertools = { version = "0.14.0" }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
num_cpus = "1.13"
parking = "2.0.0"
parking_lot = { version = "0.12.1" }
postage = { version = "0.5", features = ["futures-traits"] }
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
profiling = { version = "1" }
rand = { version = "0.9" }
raw-window-handle = { version = "0.6" }
regex = { version = "1.5" }
refineable = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
scheduler = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
usvg = { version = "0.46.0", default-features = false }
ttf-parser = "0.25"
util_macros = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
schemars = { version = "1.0", features = ["indexmap2"] }
seahash = "4.1"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = { version = "1.0.6" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
async-channel = { version = "2.5.0" }
stacksafe = { version = "1.0" }
strum = { version = "0.27.2", features = ["derive"] }
sum_tree = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
taffy = "=0.13.0"
thiserror = { version = "2.0.12" }
tracing = { version = "0.1.40" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
hdrhistogram = { version = "7", optional = true }
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
spin = "0.10.0"
pollster = { version = "0.4.0" }
url = { version = "2.2" }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
web-time = { version = "1.1.0" }
heapless = { version = "0.9.2" }
ztracing = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.1.2", features = ["js"] }


[target.'cfg(target_os = "macos")'.dependencies]
block = { version = "0.1" }
cocoa = { version = "=0.26.0" }
cocoa-foundation = { version = "=0.2.0" }
core-foundation = { version = "0.10" }
core-foundation-sys = { version = "0.8.6" }
core-graphics = { version = "0.24" }
core-video = { version = "0.5.2", features = ["metal"] }
core-text = { version = "21" }
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types = { version = "0.5" }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
media = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
objc = { version = "0.2" }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
mach2 = { version = "0.5" }
#TODO: replace with "objc2"
metal = { version = "0.33" }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
pathfinder_geometry = { version = "0.5" }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed", optional = true }



[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power"] }


[dev-dependencies]
backtrace = { version = "0.3" }
collections = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2", features = ["test-support"] }
env_logger = { version = "0.11" }
gpui_platform = { default-features = false, git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2", features = ["font-kit", "wayland", "x11"] }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }
lyon = { version = "1.0", features = ["extra"] }
rand = { version = "0.9" }
scheduler = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2", features = ["test-support"] }
unicode-segmentation = { version = "1.10" }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
http_client = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2", features = ["test-support"] }
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"] }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2", features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = { version = "0.2.120" }
gpui_web = { git = "https://github.com/zed-industries/zed", rev = "a58fff1334b2ea44aaa579b15a5ddd21ccf20bd2" }

[build-dependencies]
embed-resource = { version = "3.0", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.71"
cbindgen = { version = "0.28.0", default-features = false }

[package.metadata.cargo-machete]
ignored = ["tracing"]
